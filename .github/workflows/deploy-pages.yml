# Publica el sitio en GitHub Pages en cada push a main.
#
# El build es una exportación estática (NEXT_OUTPUT=export). El sitio se sirve
# desde /<repositorio>, así que NEXT_BASE_PATH lleva ese prefijo, y se agrega
# .nojekyll para que Pages no ignore la carpeta _next.
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar tipos y lint
        run: |
          npm run typecheck
          npm run lint

      - name: Build estático
        env:
          NEXT_OUTPUT: export
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          # Pages sirve archivos estáticos: no hay endpoint de leads.
          NEXT_PUBLIC_DEMO: "true"
        run: npm run build

      - name: Evitar el procesamiento de Jekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
